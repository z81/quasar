[package]
name = "alice-server"
version = "0.1.0"
edition = "2021"
description = "Yandex Station (Quasar) emulator with an OpenRouter-powered voice assistant (Rust rewrite)"
license = "GPL-3.0"

[dependencies]
anyhow = "1"
hex = "0.4"
jsonwebtoken = "9"
rcgen = "0.13"
sha2 = "0.10"
bytes = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
dotenvy = "0.15"
futures-util = "0.3"
handlebars = "6"
lru = "0.13"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio-postgres = "0.7"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
prost-build = "0.14"
protox = "0.9"
