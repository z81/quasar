// The format is the one the bridge of docker/spotify encodes
general = {
  name = "Алиса";
  output_backend = "pipe";
  // senders start from the receiver's volume, and the default of -24 is -55 dB here: the pipe has no mixer
  default_airplay_volume = 0.0;
  // the default of 96 dB leaves the lower half of the sender's slider all but silent
  volume_range_db = 60;
};
pipe = {
  name = "/airplay/audio";
  output_rate = 44100;
  output_format = "S16_LE";
  output_channels = 2;
};
