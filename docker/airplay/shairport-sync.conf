// The format is the one the bridge of docker/spotify encodes
general = {
  name = "Алиса";
  output_backend = "pipe";
  // the sound keeps its level, and the sender's volume moves the station's own one instead
  // (airplay-volume): cut out of the sound, a change is heard only after what the station has
  // buffered, and macOS starts each session at a third of its slider
  ignore_volume_control = "yes";
  run_this_when_volume_is_set = "/usr/local/bin/airplay-volume";
  // the station buffers 3 s before it plays: the sound goes to the pipe 0.7 s earlier, which
  // leaves a packet from a Mac (2 s ahead, 1 s of it the pipe's) 0.3 s to arrive late
  audio_backend_latency_offset_in_seconds = -0.7;
};
pipe = {
  name = "/airplay/audio";
  output_rate = 44100;
  output_format = "S16_LE";
  output_channels = 2;
};
