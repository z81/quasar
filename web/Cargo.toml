[package]
name = "quasar-control"
version = "0.1.0"
edition = "2021"
publish = false

# Keep browser dependencies out of the server's dependency graph and build cache.
[workspace]

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["lib", "launch", "web"] }
gloo-net = { version = "0.6", features = ["json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Storage", "MediaQueryList"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
